name: easy_query
description: "An easy user-friendly chat AI-Agent for searching in Natural language data in Big Data databases."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  googleapis_auth: ^2.0.0
  googleapis: ^14.0.0
  fl_chart: ^0.70.2
  flutter_app_icons: ^0.1.1
  flutter_dotenv: ^5.2.1
  file_picker: ^8.0.6 # Added for file selection
  csv: ^6.0.0        # Added for CSV parsing
  googleapis: ^11.0.0
  googleapis_auth: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/favicon.png

